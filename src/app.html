<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			/* 按路径设置文档语言（阻塞执行，预渲染后立即正确） */
			document.documentElement.lang = location.pathname.indexOf('/en') === 0 ? 'en' : 'zh-Hant';
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
